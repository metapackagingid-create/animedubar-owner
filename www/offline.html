<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Animedubar Owner — Koneksi Terputus</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; font-family: system-ui, -apple-system, sans-serif; text-align: center;
      background: #090b10;
      color: #f4f4f5;
    }
    .card {
      max-width: 340px; width: 100%; padding: 28px 22px; border-radius: 22px;
      background: #111520;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .icon { font-size: 42px; margin-bottom: 10px; }
    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 800; }
    p { font-size: 13px; line-height: 1.5; margin: 0 0 20px; color: #a1a1aa; }
    button {
      width: 100%; padding: 12px 18px; border: 0; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer;
      background: #10B981;
      color: #090b10;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Animedubar Owner membutuhkan internet untuk memuat pembaruan otomatis &amp; streaming terbaru. Periksa jaringan Anda lalu coba lagi.</p>
    <button type="button" onclick="window.location.href='https://metapackagingid-create.github.io/animedubar-owner/'">Coba Muat Ulang</button>
  </div>
</body>
</html>
